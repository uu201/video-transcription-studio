<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101311">
  <title>{% block title %}视频转文案工作台{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/environment.css">
</head>
<body>
  <div id="console-app" class="app-shell" data-page="{{ active|default('dashboard') }}">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="返回总览">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>文案工场</strong><small>LOCAL CONTENT LAB</small></span>
      </a>
      <div class="workspace-label">WORKSPACE <span>LOCAL / 01</span></div>
      <nav class="nav" aria-label="主导航">
        <a class="nav-item {% if active == 'dashboard' %}active{% endif %}" href="/"><span class="nav-index">01</span><span>总览</span><i>↗</i></a>
        <a class="nav-item {% if active == 'sources' %}active{% endif %}" href="/scan-sources"><span class="nav-index">02</span><span>扫描源</span><i>↗</i></a>
        <a class="nav-item {% if active == 'tasks' %}active{% endif %}" href="/tasks"><span class="nav-index">03</span><span>处理任务</span><i>↗</i></a>
        <a class="nav-item {% if active == 'settings' %}active{% endif %}" href="/settings"><span class="nav-index">04</span><span>系统设置</span><i>↗</i></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="engine-card"><span class="engine-light"></span><div><strong>本地引擎在线</strong><small>工作区数据不出设备</small></div><span class="engine-arrow">↗</span></div>
        <div class="sidebar-version">SENSEVOICE / CPU<br><span>BUILD 0.1.0</span></div>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span class="crumb-muted">内容处理</span><span>/</span>{% block breadcrumb %}总览{% endblock %}</div>
        <div class="topbar-actions"><span class="connection"><span class="status-dot"></span>LOCAL ENGINE</span><button class="icon-button theme-button" type="button" title="切换显示模式" @click="toggleTheme">◐</button></div>
      </header>
      <div class="page-stage">{% block content %}{% endblock %}</div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
